[project]
name = "rmk"
version = "0.1.0"
description = "A CLI bridge between a reMarkable tablet and an LLM: pull a note, push it through the agent broker for a summary or flow diagram."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Suman" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "paramiko>=3.4",
    "rmc>=0.3.0",
    "pypdf>=4.2",
    "pypdfium2>=4.30",
    "pillow>=10",
    "platformdirs>=4.2",
    # The brain. rmk routes every LLM request through Suman's agent broker,
    # which handles provider selection and runs the logged-in `claude` CLI.
    "agent-broker",
]

[project.scripts]
rmk = "rmk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmk"]

[tool.uv.sources]
# Local sibling checkout of https://github.com/skishore1676/agent-broker
agent-broker = { path = "../agent-broker", editable = true }

[dependency-groups]
dev = ["pytest>=8.0"]
