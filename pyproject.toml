[project]
name = "rmk"
version = "0.1.0"
description = "A CLI bridge between a reMarkable tablet and an LLM: pull a note, push it to Claude for a summary or flow diagram."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Suman" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "paramiko>=3.4",
    "rmc>=0.3.0",
    "pypdf>=4.2",
    "pypdfium2>=4.30",
    "anthropic>=0.40",
    "platformdirs>=4.2",
]

[project.scripts]
rmk = "rmk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmk"]

[dependency-groups]
dev = ["pytest>=8.0"]
